[project]
name = "lc0-keras"
version = "0.1.0"
description = "Custom Keras layers for Leela Chess Zero neural networks"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Leela Chess Zero Contributors" }
]
keywords = ["chess", "neural-network", "keras", "leela-chess-zero", "lc0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tensorflow>=2.13.0",
    "keras>=3.0.0",
    "numpy>=1.23.0",
]

[project.urls]
Homepage = "https://github.com/LeelaChessZero/lc0"
Repository = "https://github.com/LeelaChessZero/lc0"
Issues = "https://github.com/LeelaChessZero/lc0/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc0keras"]

[tool.hatch.build.targets.sdist]
include = [
    "lc0keras/",
    "README.md",
]

